name: Docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install package and docs-build dependencies
        # The docs execute real runblock examples against spatialmath,
        # so those need to be present at build time, not just the
        # package itself.
        run: pip install -e . spatialmath-python ansitable numpy

      - name: Build docs
        run: sphinx-build -b html docs/source docs/build/html -W

      - uses: actions/upload-pages-artifact@v5
        # Pages deployment needs write access to the github-pages
        # environment, which PRs from forks (and even same-repo PRs,
        # depending on branch protection) don't get -- only upload the
        # artifact and deploy on an actual push to main.
        if: github.event_name == 'push'
        with:
          path: docs/build/html

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
